[project]
name = "ai-image-studio-backend"
version = "1.0.0"
description = "AI Image Studio API: generation jobs, providers, library and settings."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "pillow>=11.0",
  "cryptography>=44.0",
  "python-multipart>=0.0.18",
  "email-validator>=2.2",
  "anthropic>=2.3",
  "modal>=1.6",
  "opencv-python-headless>=4.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
# Runs inside GPU containers on any Python 3.8+: no newer syntax.
"app/gpu/agent/studio_agent.py" = ["UP"]
